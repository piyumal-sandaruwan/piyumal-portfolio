services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piyumal-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
